# named list of all robots
fileversion: 3

robots:
  cf231:
    enabled: true
    uri: radio://0/100/2M/E7E7E7E7E7
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

  cf5:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E705
    initial_position: [1.0, 0.0, 0.0]
    type: cf21  # see robot_types

# Definition of the various robot types
robot_types:
  cf21:
    motion_capture:
      tracking: "librigidbodytracker" # one of "vendor", "librigidbodytracker"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

  cf21_mocap_deck:
    motion_capture:
      tracking: "librigidbodytracker"
      marker: mocap_deck
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

# global settings for all robots
all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2  # 1: complementary, 2: kalman
      controller: 1 # 1: PID (consigliato per UWB), 2: mellinger
    loco:
      mode: 1 # 0: Auto, 1: TWR (1 drone), 2: TDoA2, 3: TDoA3 (più droni)
    kalman:
      resetEstimation: 1
      robustTwr: 1  # usa robustTdoa: 1 quando passi a mode 2 o 3
    # locSrv:
    #   extPosStdDev: 1e-3
    #   extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1